<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CricketPulse — Live IPL AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a;
      --card: #111827;
      --border: #1f2937;
      --purple: #7c3aed;
      --teal: #0d9488;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --blue: #2563eb;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 16px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--purple); }

    .status-dot { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .dot.live { background: var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

    /* Match header */
    .match-header { grid-column: 1 / -1; }
    .teams { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 12px; }
    .team-name { font-size: 1.1rem; font-weight: 600; }
    .vs { color: var(--muted); font-size: 0.9rem; }
    .match-meta { display: flex; justify-content: center; gap: 24px; }
    .stat { text-align: center; }
    .stat-val { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Win probability */
    .prob-bar-wrap { margin-top: 8px; }
    .prob-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .prob-values { display: flex; justify-content: space-between; font-size: 1rem; font-weight: 700; }
    .prob-bar {
      height: 20px; border-radius: 10px; background: var(--border);
      overflow: hidden; display: flex; margin-top: 8px;
      transition: all 0.6s ease;
    }
    .prob-batting {
      background: linear-gradient(90deg, var(--purple), #9f67f5);
      transition: width 0.6s ease;
    }
    .prob-bowling {
      background: linear-gradient(90deg, #0f766e, var(--teal));
      transition: width 0.6s ease;
    }

    /* Alert banner */
    .alert-banner {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #7f1d1d, var(--red));
      border: 1px solid var(--red); border-radius: 12px;
      padding: 14px 20px; font-weight: 600; font-size: 1rem;
      display: none; text-align: center;
      animation: alertIn 0.3s ease;
    }
    @keyframes alertIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .alert-banner.visible { display: block; }

    /* Commentary */
    .commentary-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
    .commentary-list li {
      background: #1a2236; border-radius: 8px; padding: 10px 12px;
      font-size: 0.88rem; line-height: 1.4; border-left: 3px solid var(--purple);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .commentary-ts { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

    /* Ball log */
    .ball-log { display: flex; flex-wrap: wrap; gap: 6px; }
    .ball-chip {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700;
      animation: fadeIn 0.3s ease;
    }
    .chip-dot  { background: #374151; color: var(--muted); }
    .chip-low  { background: #1e3a5f; color: #60a5fa; }
    .chip-four { background: #14532d; color: #4ade80; }
    .chip-six  { background: #451a03; color: #fbbf24; }
    .chip-wkt  { background: #7f1d1d; color: #fca5a5; }

    .no-data { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  </style>
</head>
<body>

<header>
  <h1>Cricket<span>Pulse</span> ⚡</h1>
  <div class="status-dot">
    <div class="dot" id="conn-dot"></div>
    <span id="conn-label">Connecting...</span>
  </div>
</header>

<div class="grid">

  <!-- Match header -->
  <div class="card match-header">
    <h2>Live Match</h2>
    <div class="teams">
      <span class="team-name" id="batting-team">—</span>
      <span class="vs">vs</span>
      <span class="team-name" id="bowling-team">—</span>
    </div>
    <div class="match-meta">
      <div class="stat">
        <div class="stat-val" id="score">—</div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="over">—</div>
        <div class="stat-label">Over</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="inning">—</div>
        <div class="stat-label">Innings</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="target">—</div>
        <div class="stat-label">Target</div>
      </div>
    </div>
  </div>

  <!-- Alert -->
  <div class="alert-banner" id="alert-banner"></div>

  <!-- Win probability -->
  <div class="card">
    <h2>Win Probability</h2>
    <div class="prob-bar-wrap">
      <div class="prob-values">
        <span id="batting-prob-val" style="color:var(--purple)">50%</span>
        <span id="bowling-prob-val" style="color:var(--teal)">50%</span>
      </div>
      <div class="prob-labels">
        <span id="batting-prob-team">Batting</span>
        <span id="bowling-prob-team">Bowling</span>
      </div>
      <div class="prob-bar">
        <div class="prob-batting" id="prob-batting-bar" style="width:50%"></div>
        <div class="prob-bowling" id="prob-bowling-bar" style="width:50%"></div>
      </div>
    </div>
  </div>

  <!-- Ball log -->
  <div class="card">
    <h2>Ball Log</h2>
    <div class="ball-log" id="ball-log">
      <span class="no-data">Waiting for match data...</span>
    </div>
  </div>

  <!-- Commentary -->
  <div class="card" style="grid-column: 1 / -1">
    <h2>Live Commentary</h2>
    <ul class="commentary-list" id="commentary-list">
      <li><span class="no-data">Waiting for commentary...</span></li>
    </ul>
  </div>

</div>

<script>
  const MAX_COMMENTARY = 10;
  const MAX_BALLS = 20;

  let commentaryItems = [];
  let ballChips = [];

  function ballChipClass(runs, isWicket) {
    if (isWicket) return 'chip-wkt';
    if (runs === 0) return 'chip-dot';
    if (runs >= 6) return 'chip-six';
    if (runs >= 4) return 'chip-four';
    return 'chip-low';
  }

  function ballChipLabel(runs, isWicket) {
    if (isWicket) return 'W';
    return runs === 0 ? '·' : runs;
  }

  function updateDashboard(payload) {
    const { ball, win_prob, commentary, alert } = payload;

    // Match header
    document.getElementById('batting-team').textContent = ball.batting_team;
    document.getElementById('bowling-team').textContent = ball.bowling_team;
    document.getElementById('inning').textContent = ball.inning;
    document.getElementById('over').textContent = `${ball.over}.${ball.ball}`;

    // Win probability bar
    const bp = win_prob.batting_prob;
    const bwp = win_prob.bowling_prob;
    document.getElementById('prob-batting-bar').style.width = bp + '%';
    document.getElementById('prob-bowling-bar').style.width = bwp + '%';
    document.getElementById('batting-prob-val').textContent = bp + '%';
    document.getElementById('bowling-prob-val').textContent = bwp + '%';
    document.getElementById('batting-prob-team').textContent = win_prob.batting_team;
    document.getElementById('bowling-prob-team').textContent = win_prob.bowling_team;

    // Commentary
    if (commentary) {
      const ts = new Date(payload.timestamp).toLocaleTimeString();
      commentaryItems.unshift({ text: commentary, ts });
      if (commentaryItems.length > MAX_COMMENTARY) commentaryItems.pop();

      const list = document.getElementById('commentary-list');
      list.innerHTML = commentaryItems.map(c =>
        `<li>${c.text}<div class="commentary-ts">${c.ts}</div></li>`
      ).join('');
    }

    // Alert banner
    if (alert) {
      const banner = document.getElementById('alert-banner');
      banner.textContent = alert;
      banner.classList.add('visible');
      setTimeout(() => banner.classList.remove('visible'), 4000);
    }

    // Ball log chips
    const chipClass = ballChipClass(ball.batsman_runs, ball.is_wicket);
    const chipLabel = ballChipLabel(ball.batsman_runs, ball.is_wicket);
    ballChips.unshift({ cls: chipClass, label: chipLabel });
    if (ballChips.length > MAX_BALLS) ballChips.pop();

    const logEl = document.getElementById('ball-log');
    logEl.innerHTML = ballChips.map(c =>
      `<div class="ball-chip ${c.cls}">${c.label}</div>`
    ).join('');
  }

  function connect() {
    const ws = new WebSocket('ws://localhost:8000/ws');
    const dot = document.getElementById('conn-dot');
    const label = document.getElementById('conn-label');

    ws.onopen = () => {
      dot.classList.add('live');
      label.textContent = 'Live';
    };

    ws.onmessage = (e) => {
      try {
        const payload = JSON.parse(e.data);
        updateDashboard(payload);
      } catch (err) {
        console.error('Parse error', err);
      }
    };

    ws.onclose = () => {
      dot.classList.remove('live');
      label.textContent = 'Disconnected — reconnecting...';
      setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
